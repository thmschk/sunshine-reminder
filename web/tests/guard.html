<!doctype html>
<meta charset="utf-8">
<title>Schutzschalter und HTML-Einschleusung</title>
<!-- Mit echter Wartezeit aufrufen (Screenshot), nicht mit virtueller Zeit: IndexedDB hängt dort. -->
<body style="font:16px monospace"><pre id="out">läuft</pre>
<script type="module">
import { IbsClient, IbsAuthError, collect, pacing } from "../ibs.js";
import { guardHooks, paused, resume, probeResume, reachability, IbsPausedError, IbsBudgetError, budgetFor, unmetered } from "../guard.js";
import { kvDel, kvGet, kvSet } from "../idb.js";

const lines = [];
const out = document.getElementById("out");
const check = (name, ok, extra = "") => { lines.push(`${ok ? "ok  " : "FAIL"} ${name}${extra ? ` (${extra})` : ""}`); out.textContent = lines.join("\n") + "\n…"; };
window.addEventListener("unhandledrejection", (e) => { lines.push("REJ " + e.reason); out.textContent = lines.join("\n"); });
const realFetch = window.fetch;
pacing.retryMs = 50;
let probes = 0;
let probeOk = false;
reachability.probe = async () => { probes++; return probeOk; };
let calls = 0;
const reset = async () => { calls = 0; probes = 0; probeOk = false; await resume(); await kvDel("ibsBudget"); await kvDel("ibsSilent"); };
const setNet = (type) => Object.defineProperty(navigator, "connection", { value: type ? { type } : undefined, configurable: true });
const minutesLeft = async () => Math.round(((await paused())?.until - Date.now()) / 60000);

try {
  // 1. Gesperrt: Login scheitert wie bei IBS5 mit einem Netzfehler → Pause, danach keine Anfrage mehr.
  await reset();
  window.fetch = async () => { calls++; throw new TypeError("Failed to fetch"); };
  const c = new IbsClient(undefined, guardHooks);
  let e1 = null;
  try { await c.login("1", "x"); } catch (e) { e1 = e; }
  check("Netzfehler beim Login pausiert", !!(await paused()), e1?.message);
  let e2 = null;
  try { await c.login("1", "x"); } catch (e) { e2 = e; }
  check("ein zweiter Versuch, während der Pause keine Anfrage", e2 instanceof IbsPausedError && calls === 2, `Anfragen: ${calls}`);
  check("erstes Schweigen: 10 Minuten, vorher Logo geprüft", (await minutesLeft()) === 10 && probes === 1, `${await minutesLeft()} min, ${probes} Proben`);
  await resume(); // „Trotzdem jetzt versuchen“
  try { await c.login("1", "x"); } catch { /* erwartet */ }
  check("Schweigen binnen 5 Minuten: dieselbe Störung, weiter 10 Minuten", (await minutesLeft()) === 10, `${await minutesLeft()} min`);
  for (const [want, label] of [[30, "zweite Störung binnen 6 h: 30 Minuten"], [60, "dritte: 60 Minuten"], [60, "vierte: höchstens 60 Minuten"]]) {
    const s = await kvGet("ibsSilent");
    await kvSet("ibsSilent", { ...s, at: Date.now() - 20 * 60 * 1000 });
    await resume();
    try { await c.login("1", "x"); } catch { /* erwartet */ }
    check(label, (await minutesLeft()) === want, `${await minutesLeft()} min`);
  }
  await kvSet("ibsSilent", { at: Date.now() - 7 * 3600 * 1000, step: 2 });
  await resume();
  try { await c.login("1", "x"); } catch { /* erwartet */ }
  check("nach sechs Stunden wieder 10 Minuten", (await minutesLeft()) === 10, `${await minutesLeft()} min`);

  // 1a. Logo lädt: Verbindung nicht gesperrt, keine Pause, Stufe unverändert.
  await reset();
  probeOk = true;
  let e1a = null;
  try { await c.login("1", "x"); } catch (e) { e1a = e; }
  check("Logo lädt: Fehler, aber keine Pause", e1a?.network && !(await paused()) && probes === 1 && (await kvGet("ibsSilent")) === undefined, e1a?.message);

  // 1e. Während der Pause: Probe glückt → Pause endet; scheitert → bleibt.
  await reset();
  try { await c.login("1", "x"); } catch { /* */ }
  check("Probe scheitert: Pause bleibt", (await probeResume()) === false && !!(await paused()));
  probeOk = true;
  check("Probe glückt: Pause endet", (await probeResume()) === true && !(await paused()));

  // 1f. Weckruf: eine Pause, die länger als pauseMaxAgeMs läuft, hält ihn nicht auf.
  await reset();
  try { await c.login("1", "x"); } catch { /* */ }
  const p1f = await kvGet("ibsPause");
  window.fetch = async () => { calls++; return new Response(JSON.stringify({ token: "t", name1: "" })); };
  const cw = new IbsClient(undefined, guardHooks);
  cw.pauseMaxAgeMs = 20 * 60 * 1000;
  let e1f2 = null;
  try { await cw.login("1", "x"); } catch (e) { e1f2 = e; }
  check("Weckruf: frische Pause gilt", e1f2 instanceof IbsPausedError);
  await kvSet("ibsPause", { ...p1f, at: Date.now() - 21 * 60 * 1000 });
  calls = 0;
  await cw.login("1", "x");
  check("Weckruf: Pause älter als 20 Minuten gilt nicht", calls === 1 && !!(await paused()));
  window.fetch = async () => { calls++; throw new TypeError("Failed to fetch"); };

  // 1b. Geglückter Login setzt die Zählung zurück.
  await reset();
  await kvSet("ibsSilent", { at: Date.now() - 60000, step: 1 });
  window.fetch = async () => { calls++; return new Response(JSON.stringify({ token: "t", name1: "" })); };
  await new IbsClient(undefined, guardHooks).login("1", "x");
  check("geglückter Login löscht die Zählung", (await kvGet("ibsSilent")) === undefined);
  await kvSet("ibsSilent", { at: Date.now() - 60000, step: 1 });
  const c1b = new IbsClient(undefined, guardHooks); c1b.token = "t";
  window.fetch = async () => { calls++; return new Response("<div></div>"); };
  await c1b.dayplan("2026-10-06");
  check("jede geglückte Antwort löscht die Zählung", (await kvGet("ibsSilent")) === undefined);

  // 1c. Netzwechsel hebt die Pause auf (IP-Sperre), gleiches Netz nicht.
  await reset();
  setNet("wifi");
  window.fetch = async () => { calls++; throw new TypeError("Failed to fetch"); };
  try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch { /* */ }
  check("Pause im WLAN", !!(await paused()));
  setNet("cellular");
  check("im Mobilfunk keine Pause", !(await paused()));
  await reset();
  try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch { /* */ }
  setNet("cellular");
  check("im selben Netz bleibt sie", !!(await paused()));
  setNet(null);
  check("ohne Netzangabe (iPhone) bleibt sie", !!(await paused()));

  // 1d. Weiterleitung beim Login ist eine Störung: keine Ablehnung, keine Pause.
  await reset();
  for (const [what, resp] of [["Weiterleitung", { type: "opaqueredirect", ok: false, status: 0 }], ["HTTP 401", new Response("", { status: 401 })]]) {
    window.fetch = async () => { calls++; return resp; };
    let e1d = null;
    try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch (e) { e1d = e; }
    check(`${what} beim Login: keine Ablehnung, keine Pause`, e1d && !(e1d instanceof IbsAuthError) && !(await paused()), e1d?.message);
  }

  // 2. Angemeldet, Abruf scheitert auch im zweiten Versuch, genau ein erneuter Login (ohne weiteren Versuch), dann Pause.
  await reset();
  let n = 0;
  window.fetch = async (url) => {
    calls++;
    if (String(url).includes("/Login/Login") && n++ === 0) return new Response(JSON.stringify({ token: "t", name1: "" }));
    throw new TypeError("Failed to fetch");
  };
  const c2 = new IbsClient(undefined, guardHooks);
  await c2.login("1", "x");
  try { await c2.weekplan(2026, 41); } catch { /* erwartet */ }
  try { await c2.login("1", "x"); } catch { /* erwartet: Login-Retry scheitert */ }
  try { await c2.weekplan(2026, 41); } catch { /* erwartet: pausiert */ }
  check("ein Folgeversuch, dann Pause", calls === 4 && !!(await paused()), `Anfragen: ${calls}`);

  // 403 beim Login: falsches Passwort (IBS5-Layout seit 09.10.2026), keine Pause.
  await reset();
  window.fetch = async () => { calls++; return new Response("", { status: 403 }); };
  let e1f = null;
  try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch (e) { e1f = e; }
  check("HTTP 403 beim Login: Ablehnung, keine Pause", e1f instanceof IbsAuthError && !(await paused()), e1f?.message);

  // 3. 429 pausiert, 403 nach Login nicht.
  await reset();
  window.fetch = async () => { calls++; return new Response("", { status: 429 }); };
  try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch { /* */ }
  check("HTTP 429 pausiert", !!(await paused()));
  await reset();
  window.fetch = async () => { calls++; return new Response("", { status: 403 }); };
  const c3 = new IbsClient(undefined, guardHooks); c3.token = "t";
  try { await c3.weekplan(2026, 41); } catch { /* */ }
  check("HTTP 403 bei Abruf pausiert nicht", !(await paused()));

  // Stundenbudget: gleichzeitige Zählungen (Seite, Service Worker, mehrere Kinder) gehen nicht verloren.
  await reset();
  await Promise.all(Array.from({ length: 20 }, () => guardHooks.before({ weight: 1 })));
  const counted = ((await kvGet("ibsBudget")) || []).length;
  check("gleichzeitig gezählt", counted === 20, `${counted} von 20`);

  // 4. Stundenbudget.
  await reset();
  const oldest = Date.now() - 50 * 60 * 1000;
  // Der Login braucht zwei Plätze (CORS-Vorabfrage): bei 149 belegten fehlt einer, frei wird er mit der ältesten.
  await kvSet("ibsBudget", [oldest, ...Array.from({ length: 148 }, () => Date.now())]);
  window.fetch = async () => { calls++; return new Response("{}"); };
  let e4 = null;
  try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch (e) { e4 = e; }
  check("volles Stundenkontingent bremst", e4 instanceof IbsBudgetError && calls === 0);
  check("… und sagt, dass es die App selbst ist", /App hat in der letzten Stunde/.test(e4?.message) && !/sperrt gerade/.test(e4?.message), e4?.message);
  check("… nur bis die älteste Anfrage herausfällt, ohne Dauerpause",
    Math.abs(e4.until - (oldest + 3600 * 1000)) < 1000 && !(await paused()));

  // 4b. Jede Abfrage zählt doppelt (X-Requested-With löst eine CORS-Vorabfrage aus), auch der Login.
  await reset();
  await kvSet("ibsBudget", Array.from({ length: 149 }, () => Date.now()));
  window.fetch = async () => { calls++; return new Response(JSON.stringify({ token: "t", name1: "" })); };
  const c4 = new IbsClient(undefined, guardHooks); c4.token = "t";
  let e4b = null;
  try { await c4.weekplan(2026, 41); } catch (e) { e4b = e; }
  let e4l = null;
  try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch (e) { e4l = e; }
  check("Abfrage mit Token und Login brauchen je zwei Plätze", e4b instanceof IbsPausedError && e4l instanceof IbsPausedError && calls === 0);
  await kvSet("ibsBudget", Array.from({ length: 148 }, () => Date.now()));
  await new IbsClient(undefined, guardHooks).login("1", "x");
  check("Login passt in die letzten zwei Plätze", calls === 1 && (await kvGet("ibsBudget")).length === 150);

  // 4c. Vorabprüfung fürs Bestellen: zählt nichts, wirft, wenn es nicht mehr passt.
  await reset();
  await kvSet("ibsBudget", Array.from({ length: 140 }, () => Date.now()));
  let e4c = null;
  try { await budgetFor(10); } catch (e) { e4c = e; }
  check("Vorabprüfung: passt genau", e4c === null && (await kvGet("ibsBudget")).length === 140, e4c?.message);
  try { await budgetFor(11); } catch (e) { e4c = e; }
  check("Vorabprüfung: passt nicht", e4c instanceof IbsBudgetError, e4c?.message);
  e4c = null;
  try { await budgetFor(151); } catch (e) { e4c = e; }
  check("Vorabprüfung: mehr als eine Stunde fasst", e4c && !(e4c instanceof IbsPausedError) && /kleineren Portionen/.test(e4c.message), e4c?.message);

  // 4d. Eine laufende Bestellung bremst die Stunde nicht, gezählt wird trotzdem.
  await reset();
  await kvSet("ibsBudget", Array.from({ length: 150 }, () => Date.now()));
  window.fetch = async () => { calls++; return new Response("{}"); };
  const c4d = new IbsClient(undefined, guardHooks); c4d.token = "t";
  let e4d = null;
  try { await unmetered(c4d, () => c4d.weekplan(2026, 41)); } catch (e) { e4d = e; }
  check("ohne Bremse: Anfrage geht raus und zählt", !e4d && calls === 1 && (await kvGet("ibsBudget")).length === 152, e4d?.message);
  e4d = null;
  try { await c4d.weekplan(2026, 41); } catch (e) { e4d = e; }
  check("danach bremst es wieder", e4d instanceof IbsBudgetError && calls === 1);

  // 5. Eingeschleustes HTML im Gerichtsnamen landet nur als Text auf der Seite.
  await reset();
  window.__xss = 0;
  const evil = `&lt;img src=x onerror=&quot;window.__xss=1&quot;&gt;Nudeln`;
  window.fetch = async (url) => String(url).includes("/Login/")
    ? new Response(JSON.stringify({ token: "t", name1: "" }))
    : new Response(`<div id="weekplan">KW 41<button class="menuplan-checkbox" data-order-status="2" data-quantity-ordered="1" data-quantity-in-shopping-cart="" data-date="06.10.2026" data-name="${evil}" id="menu_quantity_2026-10-06_16_827"></button></div>`);
  const c5 = new IbsClient(undefined, guardHooks);
  await c5.login("1", "x");
  const [day] = await collect(c5, ["2026-10-06"]);
  check("Parser liefert den Namen als Text", day.entries[0].name.startsWith("<img"));
} catch (e) {
  lines.push("FAIL Ausnahme: " + e);
}
window.fetch = realFetch;
await resume(); await kvDel("ibsBudget"); await kvDel("ibsSilent");
document.getElementById("out").textContent = lines.join("\n") + (lines.some((l) => l.startsWith("FAIL")) ? "\n\nFEHLGESCHLAGEN" : "\n\nALLE OK");
</script>
