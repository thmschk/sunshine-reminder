<!doctype html>
<meta charset="utf-8">
<title>Oberfläche: Fristen, Fehler, Doppelklicks</title>
<!-- Befunde aus #4 an der echten Seite gegen vorgetäuschtes IBS5, Sdui und Server. Ohne ?mode= laufen alle
     Fälle nacheinander je in einem Rahmen (eine Seite teilt IndexedDB, deshalb nicht gleichzeitig). -->
<link rel="stylesheet" href="../style.css">
<body><pre id="out">läuft</pre>
<header><h1>t</h1><a id="btn-web" hidden></a><button id="btn-reload" hidden></button><button id="btn-add" hidden></button><button id="btn-settings" hidden></button></header>
<main id="app"></main><footer id="footer" hidden></footer>
<script type="module">
const MODES = ["sdui", "retry", "save", "remove", "weekdays", "sduiback", "orderback", "orderweeks", "orderbudget", "ordercart", "orderdone", "cartsend", "cartdiscard", "a11y", "pushkey", "pushkeysame", "errtext", "uifix", "groups"];
const mode = new URLSearchParams(location.search).get("mode");
const $out = document.getElementById("out");
const summary = (lines) => `${lines.join("\n")}\n\n${lines.some((l) => l.startsWith("FAIL")) ? "FEHLGESCHLAGEN" : "ALLE OK"}`;

if (!mode) {
  document.querySelector("header").hidden = true;
  const lines = [];
  for (const m of MODES) {
    const f = document.createElement("iframe");
    f.src = `ui.html?mode=${m}`;
    document.body.append(f);
    const text = await new Promise((resolve) => {
      const t0 = Date.now();
      (function poll() {
        const t = f.contentDocument?.getElementById("out")?.textContent || "";
        if (/ALLE OK|FEHLGESCHLAGEN/.test(t)) resolve(t);
        else if (Date.now() - t0 > 30000) resolve(`FAIL ${m}: kein Ergebnis`);
        else setTimeout(poll, 50);
      })();
    });
    lines.push(`# ${m}`, ...text.split("\n").filter((l) => /^(ok|FAIL)/.test(l)));
    f.remove();
  }
  $out.textContent = summary(lines);
} else {
  const lines = [];
  const P = (m) => lines.push(m);
  window.addEventListener("error", (e) => P("FAIL ERR " + e.message + " " + e.filename + ":" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => P("FAIL REJ " + (e.reason?.stack || e.reason)));
  window.setTimeout = (fn) => { const c = new MessageChannel(); c.port1.onmessage = () => fn(); c.port2.postMessage(0); return 0; };
  window.confirm = () => true;
  const { kvClear, kvGet, kvSet, secretGet, secretSet } = await import("../idb.js");
  const { saveAccounts } = await import("../accounts.js");
  await kvClear();
  const until = (cond) => new Promise((r) => { let n = 0; (function tick() { if (cond() || ++n > 200000) r(); else window.setTimeout(tick); })(); });
  const ticks = (n) => new Promise((r) => { (function tick() { if (--n <= 0) r(); else window.setTimeout(tick); })(); });
  const check = (ok, what) => P(`${ok ? "ok  " : "FAIL"} ${what}`);
  const $ = (sel) => document.querySelector(sel);
  const errorText = () => [...document.querySelectorAll(".error")].map((x) => x.textContent).join(" | ");
  /** Antwort, die erst kommt, wenn der Test sie freigibt. */
  const held = () => { let release; const p = new Promise((r) => { release = r; }); return { p, release }; };

  let asked = 0;
  Notification.requestPermission = async () => { asked++; return "granted"; };
  const fakeSub = { toJSON: () => ({ endpoint: "https://push.example/x", keys: { p256dh: "p", auth: "a" } }) };
  PushManager.prototype.getSubscription = async () => null;
  PushManager.prototype.subscribe = async () => fakeSub;
  const register = navigator.serviceWorker.register.bind(navigator.serviceWorker);
  navigator.serviceWorker.register = (u, o) => register("../" + u, o);

  const dayHtml = (url, status = 2) => {
    const d = (/date=([\d-]+)/.exec(url) || [])[1] || "2026-10-06";
    return `<li id="dayplan"><button class="menuplan-checkbox" data-order-status="${status}" data-quantity-ordered="${status === 2 ? 1 : ""}" data-quantity-in-shopping-cart="" data-date="x" data-readonly="false" data-name="Nudeln" id="menu_quantity_mobile-${d}_16_827" onclick="DayPlan.changeItemQuantity('', 1, 'x', '1000', '827', '${d}', 'u', true, '16', 'n');"></button></li>`;
  };
  // Je Fall: Sdui- und Server-Anfragen (sdui, api), sonst IBS5 (ibs); null = Standardantwort.
  const hooks = { sdui: null, api: null, ibs: null, status: 2, cart: [] };
  // Warenkorb wie die Handy-Seite von IBS5: Zahl, Seite, „Alle Änderungen verwerfen“.
  const cartPage = () => `<div id="shopping-cart"><ul>${hooks.cart.map(([d, n]) => `<li><div class="menu-mobile">
    <div class="basket-status"><span class="date">${d}</span><span class="title">Neubestellung</span></div>
    <div class="menu-details-mobile"><p><span>${n}</span></p></div></div></li>`).join("")}</ul></div>`;
  const posted = [];
  window.fetch = async (url, init = {}) => {
    url = String(url);
    if (url.includes("/api/sdui/")) return hooks.sdui ? hooks.sdui(url, init) : new Response("{}", { status: 500 });
    if (url.includes("/api/")) {
      if (hooks.api) { const r = await hooks.api(url, init); if (r) return r; }
      if (url.endsWith("/api/vapid")) return new Response(JSON.stringify({ publicKey: "AAAA" }));
      if (url.endsWith("/api/subscriptions")) { posted.push(JSON.parse(init.body)); return new Response(JSON.stringify({ id: "s1", secret: "z" })); }
      return new Response("{}");
    }
    if (url.endsWith("ferien.json")) return new Response("", { status: 404 });
    if (url.includes("/Login/")) return new Response(JSON.stringify({ token: "t", name1: "Muster, Mia" }));
    if (hooks.ibs) { const r = await hooks.ibs(url, init); if (r) return r; }
    if (url.includes("/UpdateBalanceAndCart")) return new Response(JSON.stringify({ totalItemsInCart: hooks.cart.length, messageStatus: "OK" }));
    if (url.includes("/cart/shoppingcart")) return new Response(cartPage());
    if (url.includes("/Cart/Clear")) { hooks.cart = []; return new Response("{}"); }
    return new Response(dayHtml(url, hooks.status));
  };
  const account = () => saveAccounts([{ customerNo: "1000", password: "a", name: "" }]);
  const homeLoaded = () => $(".hero") && !document.getElementById("refresh");
  const orderLoaded = () => $("#o-more")?.hidden === true;
  const submitLogin = () => {
    document.getElementById("cn").value = "1000";
    document.getElementById("pw").value = "x";
    $("#f-login button[type=submit]").click();
  };

  if (mode === "sdui") {
    // Sdui antwortet nie: nach der Frist kommt die Übersicht mit Hinweis statt „Lädt …“.
    await account();
    await secretSet("sdui", { token: "st", expires: Date.now() + 1e10, slink: "s", childId: 5, childName: "Mia" });
    const frist = [];
    const orig = AbortSignal.timeout.bind(AbortSignal);
    AbortSignal.timeout = (ms) => { frist.push(ms); return orig(30); };
    let sduiCalls = 0;
    hooks.sdui = (url, init) => {
      sduiCalls++;
      return new Promise((_, reject) => {
        if (!init.signal) return; // ohne Frist hängt sie wirklich
        init.signal.addEventListener("abort", () => reject(init.signal.reason));
      });
    };
    await import("../app.js");
    await until(() => homeLoaded() && /Sdui/.test(errorText()));
    check(sduiCalls > 0, `Sdui gefragt (${sduiCalls}×)`);
    check(homeLoaded(), "Übersicht geladen, obwohl Sdui nicht antwortet");
    check(/Sdui antwortet nicht/.test(errorText()), `Hinweis: ${errorText()}`);
    check(frist.length && frist.every((ms) => ms > 0 && ms <= 20000), `Fristen gesetzt: ${[...new Set(frist)]}`);
    const before = sduiCalls;
    document.getElementById("btn-reload").click();
    await until(() => document.getElementById("refresh"));
    await until(() => homeLoaded() && /Sdui/.test(errorText()));
    check(sduiCalls === before && /Sdui antwortet nicht/.test(errorText()), `⟳ wartet nicht erneut auf Sdui, Hinweis bleibt (${sduiCalls - before} neue Anfragen)`);
  } else if (mode === "retry") {
    // Anmeldung hängt an einer Pause; „Trotzdem jetzt versuchen“ behält den Haken „Erinnern“.
    await kvSet("ibsPause", { until: Date.now() + 3600e3, reason: "Test", at: Date.now(), net: null });
    await import("../app.js");
    await until(() => document.getElementById("f-login"));
    check(document.getElementById("want-push")?.checked, "Haken „Erinnern“ gesetzt");
    submitLogin();
    await until(() => document.getElementById("b-resume"));
    check(!!document.getElementById("b-resume"), `Pause erkannt: ${errorText().slice(0, 60)}`);
    check(asked === 1, `Erlaubnis beim Abschicken erfragt (${asked})`);
    document.getElementById("b-resume").click();
    await until(() => document.querySelector(".days") && homeLoaded());
    const push = await secretGet("push");
    check(asked >= 2, `Erlaubnis beim Wiederholen erneut im Klick erfragt (${asked})`);
    check(push?.id === "s1" && posted.length === 1, "Erinnerung nach dem Wiederholen eingeschaltet");
    check(homeLoaded(), "Übersicht geladen");
  } else if (mode === "save") {
    // Gerät kann nichts verschlüsseln/speichern: Übersicht mit Hinweis statt wieder das Formular.
    SubtleCrypto.prototype.encrypt = async () => { throw new DOMException("Speicher voll", "QuotaExceededError"); };
    await import("../app.js");
    await until(() => document.getElementById("f-login"));
    submitLogin();
    await until(() => homeLoaded() || (document.getElementById("f-login") && /nicht gespeichert/.test(errorText())));
    await until(homeLoaded);
    check(!document.getElementById("f-login"), "kein Anmeldeformular nach erfolgreichem Login");
    check(homeLoaded(), "Übersicht geladen");
    check(/nicht gespeichert/.test(errorText()), `Hinweis: ${errorText()}`);
    check(!posted.length && !(await kvGet("push")), "Erinnerung nicht eingeschaltet");
  } else if (mode === "remove") {
    // Entfernen eines Kindes scheitert: Meldung in den Einstellungen, beide bleiben.
    await saveAccounts([{ customerNo: "1000", password: "a", name: "Muster, Mia" }, { customerNo: "2000", password: "b", name: "Muster, Ben" }]);
    await import("../app.js");
    await until(homeLoaded);
    document.getElementById("btn-settings").click();
    await until(() => $('[data-remove="2000"]'));
    SubtleCrypto.prototype.encrypt = async () => { throw new DOMException("Speicher voll", "QuotaExceededError"); };
    $('[data-remove="2000"]').click();
    await until(() => $('dialog [data-v="1"]'));
    check(/Ben/.test($("dialog h3").textContent), `Rückfrage im eigenen Dialog: ${$("dialog h3").textContent}`);
    $('dialog [data-v="1"]').click();
    await until(() => /Entfernen fehlgeschlagen/.test(errorText()));
    check(/Entfernen fehlgeschlagen/.test(errorText()), `Meldung: ${errorText()}`);
    check(document.querySelectorAll("[data-remove]").length === 2, "beide Kinder weiter da");
  } else if (mode === "weekdays") {
    // Während der Server die Tage speichert, nimmt die Leiste keinen Tipp an; bei Fehler gilt der alte Stand.
    // Das Abo liegt noch im Klartext wie bei älteren Installationen: es wird übernommen und verschlüsselt.
    await account();
    await kvSet("push", { id: "s1", secret: "z", time: "17:00", created: Date.now() });
    const puts = [];
    const auths = [];
    let gate = null;
    hooks.api = async (url, init) => {
      if (init.method !== "PUT") return null;
      puts.push(JSON.parse(init.body));
      auths.push(init.headers?.Authorization);
      gate = held();
      return gate.p;
    };
    await import("../app.js");
    await until(homeLoaded);
    document.getElementById("btn-settings").click();
    await until(() => $('.wd-btn[data-wd="1"]'));
    const on = () => [...document.querySelectorAll(".wd-btn.on")].map((b) => Number(b.dataset.wd)).join();
    $('.wd-btn[data-wd="1"]').click();
    await until(() => gate);
    check([...document.querySelectorAll(".wd-btn")].every((b) => b.disabled), "Tage während des Speicherns gesperrt");
    $('.wd-btn[data-wd="2"]').click();
    await ticks(20);
    check(puts.length === 1, `nur eine Anfrage unterwegs (${puts.length})`);
    gate.release(new Response("", { status: 500 }));
    await until(() => /HTTP 500/.test(errorText()));
    check(/HTTP 500/.test(errorText()), `Fehler gemeldet: ${errorText()}`);
    check(on() === "1,2,3,4,5", `Anzeige wieder auf Serverstand (${on()})`);
    check(![...document.querySelectorAll(".wd-btn")].some((b) => b.disabled), "Tage wieder wählbar");
    gate = null;
    $('.wd-btn[data-wd="1"]').click();
    await until(() => gate);
    gate.release(new Response("{}"));
    await until(() => on() === "2,3,4,5");
    check(on() === "2,3,4,5" && JSON.stringify(puts.at(-1).weekdays) === "[2,3,4,5]", `Anzeige und Server gleich (${on()})`);
    check(JSON.stringify(await kvGet("pushWeekdays")) === "[2,3,4,5]", "Tage gespeichert");
    const rec = await kvGet("push");
    check(rec?.enc === 1 && !JSON.stringify(rec).includes('"z"') && (await secretGet("push"))?.secret === "z",
      "altes Klartext-Abo übernommen und verschlüsselt");
    check(auths.length && auths.every((a) => a === "Bearer z"), `Server-Anfragen mit dem übernommenen Geheimnis (${auths.length})`);
  } else if (mode === "sduiback") {
    // „Zurück“, während Sdui die Anmeldung prüft: kein Fehler, wenn die Antwort danach kommt.
    await account();
    const gate = held();
    hooks.sdui = () => gate.p;
    await import("../app.js");
    await until(homeLoaded);
    document.getElementById("btn-settings").click();
    await until(() => document.getElementById("b-sdui-setup"));
    document.getElementById("b-sdui-setup").click();
    document.getElementById("s-school").value = "meine-schule";
    document.getElementById("s-id").value = "x";
    document.getElementById("s-pw").value = "y";
    $("#f-sdui button[type=submit]").click();
    await ticks(5);
    document.getElementById("b-back").click();
    await until(homeLoaded);
    gate.release(new Response(JSON.stringify({ meta: { errors: ["falsch"] } }), { status: 401 }));
    await ticks(200);
    check(homeLoaded() && !document.getElementById("sdui-box"), "Übersicht bleibt stehen");
  } else if (mode === "orderback") {
    // Beim Abschicken ist „Zurück“ gesperrt, bis die Ergebnismeldung steht.
    await account();
    hooks.status = 0;
    let gate = null;
    hooks.ibs = (url, init) => {
      if (!init.method || init.method === "GET" || gate) return null;
      gate = held();
      return gate.p;
    };
    await import("../app.js");
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $('#f-order input[type=radio][value="827"]') && orderLoaded());
    const radio = $('#f-order input[type=radio][value="827"]');
    radio.checked = true;
    radio.dispatchEvent(new Event("change", { bubbles: true }));
    $("#b-submit").click();
    await until(() => $('dialog [data-v="mine"]'));
    $('dialog [data-v="mine"]').click();
    await until(() => gate);
    check(!!gate, "Bestellung unterwegs");
    check(document.getElementById("b-back")?.disabled, "„Zurück“ während des Abschickens gesperrt");
    document.getElementById("b-back").click();
    await ticks(10);
    check(!!document.getElementById("f-order"), "Bestellansicht bleibt offen");
    gate.release(new Response("", { status: 500 }));
    await until(() => $(".order-result"));
    check(!!$(".order-result"), `Ergebnis sichtbar: ${$(".order-result")?.textContent.slice(0, 70)}`);
    check(!document.getElementById("b-back")?.disabled, "„Zurück“ danach wieder frei");
  } else if (mode === "orderweeks") {
    // Erst drei Wochen, weitere auf Knopfdruck bis zur Obergrenze von acht.
    await account();
    hooks.status = 0;
    const asked = new Set();
    hooks.ibs = (url) => { const d = (/date=([\d-]+)/.exec(url) || [])[1]; if (d) asked.add(d); return null; };
    await import("../app.js");
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $("fieldset.day-order") && orderLoaded());
    const weeks = () => new Set([...document.querySelectorAll("fieldset.day-order")].map((f) => {
      const d = new Date(f.id.slice(4) + "T12:00:00Z");
      return Math.floor((d - Date.UTC(2026, 0, 5)) / (7 * 86400000));
    })).size;
    const more = () => document.getElementById("b-more-weeks");
    check(weeks() === 3 && more() && !more().hidden, `erst 3 Wochen (${weeks()}), Knopf da`);
    const latest = [...asked].sort().at(-1);
    more().click();
    await until(() => orderLoaded() && weeks() === 6);
    check(weeks() === 6 && [...asked].sort().at(-1) > latest, `nach Klick 6 Wochen (${weeks()})`);
    more().click();
    await until(() => orderLoaded() && weeks() === 8);
    await ticks(20);
    check(weeks() === 8 && more().hidden, `dann 8 Wochen, Knopf weg (${weeks()})`);
  } else if (mode === "orderbudget") {
    // Passt die Bestellung nicht mehr in die Stunde, geht keine Warenkorb-Anfrage raus.
    await account();
    hooks.status = 0;
    const posts = [];
    hooks.ibs = (url, init) => { if (init.method === "POST") posts.push(url); return null; };
    await import("../app.js");
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $('#f-order input[type=radio][value="827"]') && orderLoaded());
    await kvSet("ibsBudget", Array.from({ length: 145 }, () => Date.now()));
    const radio = $('#f-order input[type=radio][value="827"]');
    radio.checked = true;
    radio.dispatchEvent(new Event("change", { bubbles: true }));
    $("#b-submit").click();
    await until(() => $('dialog [data-v="mine"]'));
    $('dialog [data-v="mine"]').click();
    await until(() => $(".order-result"));
    const msg = $(".order-result")?.textContent || "";
    check(posts.length === 0, `keine Warenkorb-Anfrage (${posts.length})`);
    check(/Nichts abgeschickt\s*Die App hat in der letzten Stunde/.test(msg), `Meldung: ${msg.slice(0, 90)}`);
  } else if (mode === "ordercart") {
    // Anderes im Warenkorb: Hinweis in der Ansicht, Liste in der Rückfrage, Verwerfen vor dem ersten Schritt.
    await account();
    hooks.status = 0;
    hooks.cart = [["Mo 09.11.2026", "Hörnchennudeln(BIO), Gemüse-Bolognese"], ["Di 10.11.2026", "Linseneintopf"]];
    const posts = [];
    hooks.ibs = (url, init) => { if (init.method === "POST" && !url.includes("/Login/")) posts.push(url.replace(/^.*\/ibs5/, "")); return null; };
    await import("../app.js");
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $(".cart-note") && orderLoaded());
    const note = $(".cart-note")?.textContent || "";
    check(/2 Einträge/.test(note) && /Mo 09\.11\.\s*Neubestellung\s*Hörnchennudeln/.test(note), `Hinweis: ${note.replace(/\s+/g, " ").slice(0, 90)}`);
    const radio = $('#f-order input[type=radio][value="827"]');
    radio.checked = true;
    radio.dispatchEvent(new Event("change", { bubbles: true }));
    $("#b-submit").click();
    await until(() => $('dialog [data-v="discard"]'));
    check(document.querySelectorAll("dialog .entries li").length === 2, "Rückfrage listet beide Einträge");
    check(!!$('dialog [data-v="all"]') && !$('dialog [data-v="mine"]'), "Knöpfe: Verwerfen, Alles abschicken");
    $('dialog [data-v=""]').click();
    await until(() => !$("dialog") && !$("#b-submit").disabled);
    check(posts.length === 0 && !$("#b-submit").disabled, `Abbrechen schickt nichts (${posts.length}), Knopf wieder frei`);
    $("#b-submit").click();
    await until(() => $('dialog [data-v="discard"]'));
    $('dialog [data-v="discard"]').click();
    await until(() => $(".order-result"));
    check(posts[0] === "/Cart/Clear", `zuerst verworfen: ${posts.join(", ")}`);
    check(!posts.includes("/Cart/Order"), "nicht abgeschickt, weil der Schein-IBS beim Bestellen kein JSON liefert");
  } else if (mode === "orderdone") {
    // Geglückte Bestellung: Ergebnis als Karte mit einer Zeile je Tag.
    await account();
    hooks.status = 0;
    let inCart = 0;
    const json = (o) => new Response(JSON.stringify(o));
    hooks.ibs = (url) => {
      if (url.includes("/Mealplan/ClearCart")) { inCart = 0; return json({ totalItemsInCart: 0, messageStatus: "OK" }); }
      if (url.includes("/Mealplan/SaveOrder")) return json({ totalItemsInCart: ++inCart, messageStatus: "OK" });
      if (url.includes("/Cart/Order")) { inCart = 0; hooks.status = 2; return json({ MessageStatus: "OK" }); }
      return null;
    };
    await import("../app.js");
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $('#f-order input[type=radio][value="827"]') && orderLoaded());
    const radio = $('#f-order input[type=radio][value="827"]');
    radio.checked = true;
    radio.dispatchEvent(new Event("change", { bubbles: true }));
    $("#b-submit").click();
    await until(() => $('dialog [data-v="mine"]'));
    $('dialog [data-v="mine"]').click();
    await until(() => $(".order-result"));
    const done = $(".order-result.done");
    check(!!done, `Ergebnis: ${$(".order-result")?.textContent.replace(/\s+/g, " ").slice(0, 90)}`);
    check(done?.querySelectorAll("li").length === 1 && /bestellt/.test(done.textContent) && /Nudeln/.test(done.textContent),
      "eine Zeile: Tag, „bestellt“, Gericht");  } else if (mode === "cartsend" || mode === "cartdiscard") {
    // Nur der Warenkorb, ohne Auswahl unten: Knöpfe in der Karte, Rückfrage, Ergebnis.
    await account();
    hooks.status = 0;
    hooks.cart = [["Mo 09.11.2026", "Hörnchennudeln(BIO), Gemüse-Bolognese"], ["Di 10.11.2026", "Linseneintopf"]];
    const posts = [];
    hooks.ibs = (url, init) => {
      if (init.method !== "POST" || url.includes("/Login/")) return null;
      posts.push(url.replace(/^.*\/ibs5/, ""));
      if (url.includes("/Cart/Order")) { hooks.cart = []; hooks.status = 2; return new Response(JSON.stringify({ MessageStatus: "OK" })); }
      return null;
    };
    await import("../app.js");
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $(".cart-note #b-cart-send") && orderLoaded());
    check($("#b-submit").disabled, "unten nichts gewählt, Abschicken unten aus");
    const send = mode === "cartsend";
    $(send ? "#b-cart-send" : "#b-cart-discard").click();
    await until(() => $('dialog [data-v="1"]'));
    check(send ? document.querySelectorAll("dialog .entries li").length === 2 : /2 Einträge werden/.test($("dialog").textContent),
      send ? "Rückfrage listet beide Einträge" : "Rückfrage nennt die Zahl");
    $('dialog [data-v="1"]').click();
    await until(() => $(".order-result"));
    const res = $(".order-result")?.textContent.replace(/\s+/g, " ") || "";
    check(send ? /✓ Abgeschickt/.test(res) : /✓ Warenkorb verworfen/.test(res), `Ergebnis: ${res.slice(0, 80)}`);
    check(JSON.stringify(posts) === JSON.stringify([send ? "/Cart/Order" : "/Cart/Clear"]), `nur eine Anfrage, die richtige: ${posts.join(", ")}`);
    $(".dialog-actions button").click();
    await until(() => !$("dialog") && orderLoaded() && !$(".cart-note"));
    check(!$(".cart-note"), "danach keine Karte mehr");
  } else if (mode === "a11y") {
    // Einleitung ganz lesbar, Tageszeilen als Knöpfe, Symbole mit Text, Hinweise im Dialog ungekürzt.
    hooks.status = 0;
    await import("../app.js");
    await until(() => document.getElementById("f-login"));
    const intro = $(".intro");
    check(intro && !intro.classList.contains("open"), "Einleitung ist keine Alarmkarte");
    check(intro && [...intro.querySelectorAll("p")].every((p) => p.offsetHeight > 0), "alle Absätze der Einleitung sichtbar");
    submitLogin();
    await until(() => homeLoaded() && $(".day-btn"));
    const rows = [...document.querySelectorAll(".days:not(.today) li")];
    check(rows.length && rows.every((li) => li.querySelector("button.day-btn")), `Tageszeilen als Knöpfe (${rows.length})`);
    check([...document.querySelectorAll(".days .sym")].every((s) => s.getAttribute("aria-hidden") === "true"
      && /^Status: /.test(s.nextElementSibling?.textContent)), "Statussymbol versteckt, Status als Text");
    // Die Kopfzeile hier ist nur Attrappe: die echte steht in index.html (fetch ist umgebogen, daher XHR).
    const index = await new Promise((r) => { const x = new XMLHttpRequest(); x.onload = () => r(x.responseXML); x.open("GET", "../index.html"); x.responseType = "document"; x.send(); });
    const icons = [...index.querySelectorAll("header .icon")];
    check(icons.length === 4 && icons.every((e) => e.getAttribute("aria-label")), "Kopfzeilen-Symbole mit aria-label");
    const small = [...document.querySelectorAll("header .icon:not([hidden]), .day-btn, #b-order-now, #b-all")]
      .filter((e) => e.getBoundingClientRect().height < 44);
    check(!small.length, `Tippflächen ≥ 44 px (${small.map((e) => e.id || e.className).join(", ")})`);
    const dlg = document.createElement("dialog");
    dlg.className = "dialog";
    dlg.innerHTML = `<p class="clamp">Gericht</p><p class="cart-extra">Hinweis</p>`;
    document.body.append(dlg);
    const clamp = (p) => getComputedStyle(p).webkitLineClamp;
    check(clamp(dlg.querySelector(".clamp")) === "3" && clamp(dlg.querySelector(".cart-extra")) === "none",
      "im Dialog nur Gerichtszeilen gekürzt");
    dlg.remove();
    rows.find((li) => li.querySelector(".sym.open")).querySelector(".day-btn").click();
    await until(() => $("#f-order") && orderLoaded());
    check(!!$("#f-order"), "Tippen auf offenen Tag öffnet die Bestellansicht");
  } else if (mode === "errtext") {
    // Netzfehler: Klartext sichtbar, die technische Meldung nur eingeklappt.
    await account();
    hooks.ibs = () => { throw new TypeError("Failed to fetch"); };
    await import("../app.js");
    await until(() => $("#b-retry"));
    const hero = $(".hero");
    const visible = [...hero.querySelectorAll(":scope > p, h2")].map((x) => x.textContent).join(" ");
    check(!/Failed|\/Login|\/Menu|HTTP/.test(visible), `Klartext ohne Interna: ${visible.slice(0, 120)}`);
    check(/Failed to fetch/.test(hero.querySelector("details.err-detail code")?.textContent || "")
      && !hero.querySelector("details.err-detail").open, "technische Meldung eingeklappt");
    check(/mobile Daten/.test(visible) && /sperrt/.test(visible), "Rat zu mobilen Daten mit Begründung");
    // Danach einmal geladen, dann scheitert die nächste Aktualisierung mit einem Stand von gestern: der wird gezeigt.
    hooks.ibs = null;
    $("#b-retry").click();
    await until(() => homeLoaded() && $(".days") && !$("#b-retry"));
    const last = await kvGet("lastDays:1000");
    await kvSet("lastDays:1000", { ...last, from: "2000-01-01", at: Date.now() - 86400e3 });
    hooks.ibs = () => { throw new TypeError("Failed to fetch"); };
    document.getElementById("btn-reload").click();
    await until(() => $("#b-retry"));
    check($(".days") && /letzte bekannte Stand von gestern/.test($(".hero").textContent),
      `alter Stand als veraltet gezeigt: ${$(".hero p.small")?.textContent}`);
  } else if (mode === "uifix") {
    // Text in Einstellungszeilen maskiert, Rückfrage vor dem Löschen eines Termins, Abschickleiste ab der ersten Änderung.
    // Das zweite Kind meldet sich nicht an, sein Name bleibt wie gespeichert.
    await saveAccounts([{ customerNo: "1000", password: "a", name: "" }, { customerNo: "2000", password: "b", name: "<b>Ben</b>" }]);
    const { addEvent, loadEvents } = await import("../events.js");
    const { todayBerlin, addDays } = await import("../ibs.js");
    await addEvent(todayBerlin(), { title: "Wandertag", date: addDays(todayBerlin(), 20), lead: 2, noMeal: false });
    hooks.status = 0;
    await import("../app.js");
    await until(homeLoaded);
    document.getElementById("btn-settings").click();
    await until(() => $("#push-switch"));
    const name = [...document.querySelectorAll(".srow-t")].find((x) => /Ben/.test(x.textContent));
    check(name && name.textContent === "<b>Ben</b>" && !name.querySelector("b"), "Name in der Zeile als Text, nicht als HTML");
    check($("#push-time").disabled && [...document.querySelectorAll(".wd-btn")].every((b) => b.disabled),
      "Erinnerung aus: Uhrzeit und Tage gesperrt");
    const days = $("#b-days");
    days.click();
    check(days.getAttribute("aria-expanded") === "true" && !$("#days-edit").hidden, "Vorwarnzeit aufgeklappt mit aria-expanded");
    $("#b-back").click();
    await until(homeLoaded);
    document.getElementById("btn-add").click();
    await until(() => $("[data-del]"));
    check(/Wandertag/.test($("[data-del]").getAttribute("aria-label")), `Löschen benennt den Termin: ${$("[data-del]").getAttribute("aria-label")}`);
    $("[data-del]").click();
    await until(() => document.querySelectorAll("dialog").length === 2);
    [...document.querySelectorAll('dialog [data-v=""]')].at(-1).click();
    await ticks(20);
    check((await loadEvents(todayBerlin())).length === 1, "Abbrechen lässt den Termin stehen");
    $("[data-del]").click();
    await until(() => document.querySelectorAll("dialog").length === 2);
    $('dialog [data-v="1"]').click();
    await until(() => !$("[data-del]"));
    check((await loadEvents(todayBerlin())).length === 0, "nach Bestätigen gelöscht");
    $("#ev-close").click();
    await until(homeLoaded);
    $("#b-order-now").click();
    await until(() => $('#f-order input[type=radio][value="827"]') && orderLoaded());
    check($("#o-bar").hidden, "ohne Änderung keine Abschickleiste");
    const radio = $('#f-order input[type=radio][value="827"]');
    radio.checked = true;
    radio.dispatchEvent(new Event("change", { bubbles: true }));
    await ticks(5);
    check(!$("#o-bar").hidden && $("#o-bar #b-submit").textContent === "1 Essen bestellen"
      && getComputedStyle($("#o-bar")).position === "fixed", `Leiste unten: ${$("#b-submit").textContent}`);
  } else if (mode === "pushkey" || mode === "pushkeysame") {
    // Bestehendes Browser-Abo: nur übernehmen, wenn es zum Server-Schlüssel passt (/api/vapid: "AAAA" = 0,0,0).
    await account();
    const same = mode === "pushkeysame";
    let unsubscribed = 0, subscribed = null;
    const old = { ...fakeSub, options: { applicationServerKey: new Uint8Array(same ? [0, 0, 0] : [1, 2, 3]).buffer },
      unsubscribe: async () => { unsubscribed++; return true; } };
    PushManager.prototype.getSubscription = async () => old;
    PushManager.prototype.subscribe = async (o) => { subscribed = [...new Uint8Array(o.applicationServerKey)]; return fakeSub; };
    await import("../app.js");
    await until(homeLoaded);
    document.getElementById("btn-settings").click();
    await until(() => document.getElementById("push-switch"));
    // Antippen der Zeile, nicht des Schalters: die ganze Zeile schaltet.
    document.getElementById("push-switch").closest(".srow").querySelector(".srow-t").click();
    await until(() => posted.length);
    check(posted.length === 1, "Erinnerung eingeschaltet über die Zeile");
    check(same ? !unsubscribed && !subscribed : unsubscribed === 1 && JSON.stringify(subscribed) === "[0,0,0]",
      same ? "passendes Abo übernommen" : `altes Abo abgemeldet, neu mit Server-Schlüssel (${subscribed})`);
  } else if (mode === "groups") {
    // Einstellungen: Bereiche eingeklappt mit Kurzfassung, Zustand übersteht neues Zeichnen, Sprungziele offen.
    await account();
    const puts = [];
    hooks.api = async (url, init) => {
      if (init.method !== "PUT") return null;
      puts.push(JSON.parse(init.body));
      return hooks.failPut ? new Response("", { status: 500 }) : new Response("{}");
    };
    await import("../app.js");
    await until(homeLoaded);
    const heads = () => [...document.querySelectorAll(".group-head")];
    const head = (k) => $(`.group-head[data-group="${k}"]`);
    const isOpen = (k) => head(k)?.getAttribute("aria-expanded") === "true" && !document.getElementById(`${k}-box`).hidden;
    const openOnes = () => heads().filter((h) => h.getAttribute("aria-expanded") === "true").map((h) => h.dataset.group).join();
    const sum = (k) => document.getElementById(`${k}-sum`)?.textContent || "";
    const settings = async () => {
      document.getElementById("btn-settings").click();
      await until(() => $("#push-switch") && /./.test(sum("sdui")) && /./.test(sum("ferien")));
    };

    // Aus dem Termindialog: „Erinnerung einschalten“ öffnet genau diesen Bereich.
    document.getElementById("btn-add").click();
    await until(() => $("#ev-settings"));
    $("#ev-settings").click();
    await until(() => $("#push-switch"));
    check(openOnes() === "push", `„Erinnerung einschalten“ öffnet nur „Erinnerung“ (${openOnes()})`);
    head("push").click();
    check(openOnes() === "", "zugeklappt");

    $("#b-back").click();
    await until(homeLoaded);
    await settings();
    check(heads().map((h) => h.dataset.group).join() === "push,morning,ferien,sdui,konto", `Bereiche: ${heads().map((h) => h.dataset.group)}`);
    check(heads().every((h) => h.tagName === "BUTTON" && h.parentElement.tagName === "H3" && h.getAttribute("aria-expanded") === "false"
      && document.getElementById(h.getAttribute("aria-controls"))?.hidden), "alle eingeklappt, Knopf mit aria-expanded/aria-controls");
    check(heads().every((h) => h.getBoundingClientRect().height >= 44 && h.querySelector("svg[aria-hidden=true]")),
      `Titel ≥ 44 px mit Pfeil (${heads().map((h) => Math.round(h.getBoundingClientRect().height))})`);
    check(sum("push") === "aus" && sum("morning") === "aus" && sum("sdui") === "nicht eingerichtet" && /^(Mia|Kd\. 1000)$/.test(sum("konto")),
      `Kurzfassungen: ${heads().map((h) => h.textContent.replace(/\s+/g, " ").trim()).join(" | ")}`);

    head("push").click();
    check(isOpen("push") && openOnes() === "push", "Antippen klappt auf");
    check(getComputedStyle($("#push-sum")).visibility === "hidden", "aufgeklappt keine Kurzfassung");
    $("#push-switch").click();
    await until(() => $("#b-push-test"));
    check(isOpen("push"), "nach dem Einschalten (neu gezeichnet) bleibt der Bereich offen");
    check(sum("push") === "werktags 17:00", `Kurzfassung: ${sum("push")}`);
    $('.wd-btn[data-wd="3"]').click();
    await until(() => sum("push") === "Mo, Di, Do, Fr 17:00");
    check(sum("push") === "Mo, Di, Do, Fr 17:00" && isOpen("push"), `Tage in der Kurzfassung: ${sum("push")}`);

    head("morning").click();
    $("#morning-switch").click();
    await until(() => $("#b-morning-test"));
    check(isOpen("morning") && isOpen("push") && sum("morning") === "07:00", `Morgenmeldung eigener Bereich, an: ${sum("morning")}`);
    check(!document.getElementById("push-box").querySelector("#morning-switch"), "Morgenmeldung nicht mehr unter „Erinnerung“");

    // Ganz neu gezeichnet (Zurück, wieder Einstellungen): offen bleibt offen, zu bleibt zu.
    $("#b-back").click();
    await until(homeLoaded);
    await settings();
    check(openOnes() === "push,morning", `nach Zurück und wieder Einstellungen offen: ${openOnes()}`);

    // Fehler in einem zugeklappten Bereich: er klappt auf und zeigt die Meldung.
    head("morning").click();
    check(!isOpen("morning"), "Morgenmeldung zugeklappt");
    hooks.failPut = true;
    $("#morning-switch").click();
    await until(() => /HTTP 500/.test(document.getElementById("morning-box").textContent));
    check(isOpen("morning") && /HTTP 500/.test(document.getElementById("morning-box").querySelector(".error")?.textContent || ""),
      "Fehler öffnet den Bereich mit der Meldung");
    check(!/HTTP 500/.test(document.getElementById("push-box").textContent), "Meldung nicht unter „Erinnerung“");
    hooks.failPut = false;

    // Über …/#betreiber ist „Erinnerung“ offen (dort steht der Schlüssel).
    head("push").click();
    location.hash = "#betreiber";
    $("#b-back").click();
    await until(homeLoaded);
    await settings();
    check(isOpen("push") && $("#b-push-admin"), "#betreiber öffnet „Erinnerung“");
    history.replaceState(null, "", location.pathname + location.search);
  }
  $out.textContent = summary(lines);
}
</script>
