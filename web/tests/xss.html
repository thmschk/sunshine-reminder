<!doctype html>
<meta charset="utf-8">
<title>HTML-Einschleusung in der Oberfläche</title>
<!-- Echte Oberfläche gegen vorgetäuschtes IBS5, Sdui und Server; alle Texte von dort enthalten HTML.
     Ohne ?mode= laufen alle Fälle nacheinander je in einem Rahmen (eine Seite teilt IndexedDB). -->
<link rel="stylesheet" href="../style.css">
<body><pre id="out">läuft</pre>
<header><h1>t</h1><a id="btn-web" hidden></a><a id="btn-stats" hidden></a><button id="btn-reload" hidden></button><button id="btn-add" hidden></button><button id="btn-settings" hidden></button></header>
<main id="app"></main><footer id="footer" hidden></footer>
<script type="module">
// start: Startseite (Gericht, Name); order: Bestellansicht, Rückfrage, Ergebnis; cart: Warenkorb-Karte und ihre
// Rückfragen; sdui: Kinderwahl, Kindername, Fächer; loginerr, sduierr, neterr: Fehlermeldungen.
const MODES = ["start", "order", "cart", "sdui", "loginerr", "sduierr", "neterr"];
const mode = new URLSearchParams(location.search).get("mode");
const $out = document.getElementById("out");
const summary = (lines) => `${lines.join("\n")}\n\n${lines.some((l) => l.startsWith("FAIL")) ? "FEHLGESCHLAGEN" : "ALLE OK"}`;

if (!mode) {
  document.querySelector("header").hidden = true;
  const lines = [];
  for (const m of MODES) {
    const f = document.createElement("iframe");
    f.src = `xss.html?mode=${m}`;
    document.body.append(f);
    const text = await new Promise((resolve) => {
      const t0 = Date.now();
      (function poll() {
        const t = f.contentDocument?.getElementById("out")?.textContent || "";
        if (/ALLE OK|FEHLGESCHLAGEN/.test(t)) resolve(t);
        else if (Date.now() - t0 > 30000) resolve(`FAIL ${m}: kein Ergebnis`);
        else setTimeout(poll, 50);
      })();
    });
    lines.push(`# ${m}`, ...text.split("\n").filter((l) => /^(ok|FAIL)/.test(l)));
    f.remove();
  }
  $out.textContent = summary(lines);
} else {
  const lines = [];
  const P = (m) => lines.push(m);
  window.addEventListener("error", (e) => P("FAIL ERR " + e.message + " " + e.filename + ":" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => P("FAIL REJ " + (e.reason?.stack || e.reason)));
  // Ohne Timer und Animationsframes warten: beide laufen im Fotomodus des Testbrowsers nicht.
  window.setTimeout = (fn) => { const c = new MessageChannel(); c.port1.onmessage = () => fn(); c.port2.postMessage(0); return 0; };
  window.confirm = () => true;
  const { kvClear, secretSet } = await import("../idb.js");
  const { saveAccounts } = await import("../accounts.js");
  const { addDays, todayBerlin, weekdayNo } = await import("../ibs.js");
  await kvClear();
  const until = (cond) => new Promise((r) => { let n = 0; (function tick() { if (cond() || ++n > 200000) r(); else window.setTimeout(tick); })(); });
  const ticks = (n) => new Promise((r) => { (function tick() { if (--n <= 0) r(); else window.setTimeout(tick); })(); });
  const check = (ok, what) => P(`${ok ? "ok  " : "FAIL"} ${what}`);
  const $ = (sel) => document.querySelector(sel);

  Object.defineProperty(Notification, "permission", { configurable: true, get: () => "granted" });
  Notification.requestPermission = async () => "granted";
  const fakeSub = { toJSON: () => ({ endpoint: "https://push.example/x", keys: { p256dh: "p", auth: "a" } }) };
  PushManager.prototype.getSubscription = async () => null;
  PushManager.prototype.subscribe = async () => fakeSub;
  const register = navigator.serviceWorker.register.bind(navigator.serviceWorker);
  navigator.serviceWorker.register = (u, o) => register("../" + u, o);

  // Eingeschleust wäre: ein <xss-x>-Element, ein Bild mit src=x oder window.__xss = 1 (onerror lief).
  window.__xss = 0;
  const EVIL = `<img src=x onerror="window.__xss=1"><xss-x>fett</xss-x>`;
  const attr = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const injected = () => !!document.querySelector("xss-x") || [...document.querySelectorAll("img")].some((i) => i.getAttribute("src") === "x");
  const asText = (el) => (el?.textContent || "").includes("<img src=x");
  /** Prüft nach einem Schritt: nichts eingeschleust, Text sichtbar (where = Element mit dem erwarteten Text). */
  const safe = async (what, where) => {
    await ticks(20);
    check(!injected() && window.__xss === 0, `${what}: kein eingeschleustes Element, kein onerror`);
    if (where !== undefined) check(asText(where), `${what}: als Text sichtbar: ${(where?.textContent || "–").replace(/\s+/g, " ").slice(0, 70)}`);
  };

  const hooks = { sdui: null, ibs: null, login: null, status: 2, cart: [] };
  const dayHtml = (url) => {
    const d = (/date=([\d-]+)/.exec(url) || [])[1] || todayBerlin();
    const s = hooks.status;
    return `<li id="dayplan"><button class="menuplan-checkbox" data-order-status="${s}" data-quantity-ordered="${s === 2 ? 1 : ""}" data-quantity-in-shopping-cart="" data-date="x" data-readonly="false" data-name="${attr(EVIL)}" id="menu_quantity_mobile-${d}_16_827" onclick="DayPlan.changeItemQuantity('', 1, 'x', '1000', '827', '${d}', 'u', true, '16', 'n');"></button></li>`;
  };
  // Warenkorb wie die Handy-Seite von IBS5; Tag in der übernächsten Woche, nie ein Tag der eigenen Auswahl.
  const cartDay = addDays(todayBerlin(), 7 + ((8 - weekdayNo(todayBerlin())) % 7 || 7));
  const cartDe = `Mo ${cartDay.slice(8, 10)}.${cartDay.slice(5, 7)}.${cartDay.slice(0, 4)}`;
  const cartPage = () => `<div id="shopping-cart"><ul>${hooks.cart.map(() => `<li><div class="menu-mobile">
    <div class="basket-status"><span class="date">${cartDe}</span><span class="title">${attr(EVIL)}</span></div>
    <div class="menu-details-mobile"><p><span>${attr(EVIL)}</span></p></div></div></li>`).join("")}</ul></div>`;
  window.fetch = async (url, init = {}) => {
    url = String(url);
    if (url.includes("/api/sdui/")) return hooks.sdui ? hooks.sdui(url, init) : new Response("{}", { status: 500 });
    if (url.includes("/api/")) {
      if (url.endsWith("/api/vapid")) return new Response(JSON.stringify({ publicKey: "AAAA" }));
      if (url.endsWith("/api/subscriptions")) return new Response(JSON.stringify({ id: "s1", secret: "z" }));
      return new Response("{}");
    }
    if (url.endsWith("ferien.json")) return new Response("", { status: 404 });
    if (hooks.ibs) { const r = await hooks.ibs(url, init); if (r) return r; }
    if (url.includes("/Login/")) return new Response(JSON.stringify(hooks.login || { token: "t", name1: `Muster, ${EVIL}` }));
    if (url.includes("/UpdateBalanceAndCart")) return new Response(JSON.stringify({ totalItemsInCart: hooks.cart.length, messageStatus: "OK" }));
    if (url.includes("/cart/shoppingcart")) return new Response(cartPage());
    if (url.includes("/Cart/Clear")) { hooks.cart = []; return new Response("{}"); }
    return new Response(dayHtml(url));
  };
  const account = () => saveAccounts([{ customerNo: "1000", password: "a", name: "" }]);
  const homeLoaded = () => $(".hero") && !document.getElementById("refresh");
  const orderLoaded = () => $("#o-more")?.hidden === true;
  const openOrder = async () => {
    await until(() => $("#b-order-now") && !document.getElementById("refresh"));
    $("#b-order-now").click();
    await until(() => $('#f-order input[type=radio][value="827"]') && orderLoaded());
  };
  const pick827 = () => {
    const radio = $('#f-order input[type=radio][value="827"]');
    radio.checked = true;
    radio.dispatchEvent(new Event("change", { bubbles: true }));
  };
  const sduiSetup = async () => {
    await until(homeLoaded);
    document.getElementById("btn-settings").click();
    await until(() => document.getElementById("b-sdui-setup"));
    document.getElementById("b-sdui-setup").click();
    document.getElementById("s-school").value = "meine-schule";
    document.getElementById("s-id").value = "x";
    document.getElementById("s-pw").value = "y";
    $("#f-sdui button[type=submit]").click();
  };

  if (mode === "start") {
    // Altes Einzelkonto (creds), Gericht und Name von IBS5 mit HTML.
    await secretSet("creds", { customerNo: "1000", password: "x" });
    await import("../app.js");
    await until(() => $(".days") && homeLoaded());
    check(!!$(".days"), "Startseite gerendert");
    await safe("Startseite", $(".dish"));
  } else if (mode === "order") {
    // Bestellansicht: Gericht in der Auswahl, in der Rückfrage und in der Ergebniskarte.
    await account();
    hooks.status = 0;
    let inCart = 0;
    const json = (o) => new Response(JSON.stringify(o));
    hooks.ibs = (url) => {
      if (url.includes("/Mealplan/ClearCart")) { inCart = 0; return json({ totalItemsInCart: 0, messageStatus: "OK" }); }
      if (url.includes("/Mealplan/SaveOrder")) return json({ totalItemsInCart: ++inCart, messageStatus: "OK" });
      if (url.includes("/Cart/Order")) { inCart = 0; hooks.status = 2; return json({ MessageStatus: "OK" }); }
      return null;
    };
    await import("../app.js");
    await openOrder();
    await safe("Auswahl", $("#f-order"));
    pick827();
    await ticks(5);
    await safe("Abschickleiste");
    $("#b-submit").click();
    await until(() => $('dialog [data-v="mine"]'));
    await safe("Rückfrage", $("dialog"));
    $('dialog [data-v="mine"]').click();
    await until(() => $(".order-result"));
    check(!!$(".order-result.done"), "Bestellung geglückt");
    await safe("Ergebniskarte", $(".order-result"));
  } else if (mode === "cart") {
    // Warenkorb mit Gericht und Bestellart als HTML: Karte, „Abschicken“-Rückfrage, Rückfrage beim eigenen Abschicken.
    await account();
    hooks.status = 0;
    hooks.cart = [1];
    await import("../app.js");
    await openOrder();
    await until(() => $(".cart-note #b-cart-send"));
    check(!!$(".cart-note #b-cart-send"), "Karte mit Knopf „Abschicken“");
    await safe("Warenkorb-Karte", $(".cart-note"));
    $("#b-cart-send").click();
    await until(() => $('dialog [data-v="1"]'));
    await safe("Rückfrage „Warenkorb abschicken“", $("dialog .entries"));
    $('dialog [data-v=""]').click();
    await until(() => !$("dialog"));
    pick827();
    $("#b-submit").click();
    await until(() => $('dialog [data-v="discard"]'));
    await safe("Rückfrage mit Warenkorb", $("dialog .entries"));
    $('dialog [data-v=""]').click();
  } else if (mode === "sdui") {
    // Zwei Kinder, Name des ersten mit HTML; danach Name in der Zeile und Fach aus dem Stundenplan.
    await account();
    const json = (o) => new Response(JSON.stringify(o));
    const begins = Math.floor(Date.now() / 1000) + 86400;
    hooks.sdui = (url) => {
      if (url.includes("auth/login")) return json({ data: { access_token: "st", expires_in: 3600 } });
      if (url.includes("timetable")) return json({ data: { lessons: [{ begins_at: begins, meta: { displayname: EVIL, shortname: EVIL, displayname_hour: "1" } }] } });
      if (url.includes("users/self")) return json({ data: { id: 9, child_pivot: [{ user_id: 1 }, { user_id: 2 }] } });
      if (url.includes("users/1")) return json({ data: { meta: { displayname: EVIL } } });
      if (url.includes("users/2")) return json({ data: { firstname: "Ben" } });
      return null;
    };
    await import("../app.js");
    await sduiSetup();
    await until(() => document.querySelectorAll("#sdui-box .kid").length === 2);
    check(document.querySelectorAll("#sdui-box .kid").length === 2, "Kinderwahl mit zwei Knöpfen");
    await safe("Kinderwahl", $("#sdui-box .kid"));
    $("#sdui-box .kid").click();
    await until(() => !$("#sdui-box .kid") && /img/.test(document.getElementById("sdui-sum")?.textContent || ""));
    await safe("Kindername in der Kurzfassung", document.getElementById("sdui-sum"));
    await safe("Kindername in der Zeile", [...document.querySelectorAll("#sdui-box .srow")].find((r) => /img/.test(r.textContent)) ?? null);
    await safe("Fach unter „Erinnern an“", $("#sdui-box .subjects"));
  } else if (mode === "loginerr") {
    // IBS5 lehnt die Anmeldung mit einer Meldung voller HTML ab.
    hooks.login = { errorMessage: EVIL };
    await import("../app.js");
    await until(() => document.getElementById("f-login"));
    document.getElementById("cn").value = "1000";
    document.getElementById("pw").value = "x";
    $("#f-login button[type=submit]").click();
    await until(() => $(".error"));
    await safe("Meldung „Anmeldung abgelehnt“", $(".error"));
  } else if (mode === "sduierr") {
    // Sdui lehnt die Anmeldung mit einer Meldung voller HTML ab.
    await account();
    hooks.sdui = () => new Response(JSON.stringify({ meta: { errors: [EVIL] } }), { status: 401 });
    await import("../app.js");
    await sduiSetup();
    await until(() => $("#sdui-box .error"));
    await safe("Sdui-Fehlermeldung", $("#sdui-box .error"));
  } else if (mode === "neterr") {
    // Netzfehler, dessen technische Meldung HTML enthält: steht nur eingeklappt und als Text da.
    await account();
    hooks.ibs = () => { throw new TypeError(EVIL); };
    await import("../app.js");
    await until(() => $("#b-retry"));
    await safe("technische Meldung", $("details.err-detail code"));
  }
  $out.textContent = summary(lines);
}
</script>
