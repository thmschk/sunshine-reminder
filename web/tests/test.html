<pre id="out">läuft</pre>
<script type="module">
import {
  parseWeekplan, OrderState, isoWeek, targetDates, placeOrders, CartResponse, Profile, De, todayBerlin, collect,
  parseOrderHistory, parseCart, cartOthers, submitCartAsSeen, addDays, DayStatus, IbsAuthError, DEFAULT_CHECK, nextWeekday, longestGap, weekdayNo, clampDaysAhead,
  ParserError, MenuEntry, lastCall,
} from "../ibs.js";

const results = [];
const test = async (name, fn) => {
  try { await fn(); results.push(`ok   ${name}`); } catch (e) { results.push(`FAIL ${name}: ${e.message}`); }
};
const eq = (a, b, what = "") => {
  if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${what} erwartet ${JSON.stringify(b)}, war ${JSON.stringify(a)}`);
};
const throws = (fn, what) => { try { fn(); } catch { return; } throw new Error(`${what}: kein Fehler`); };

const res = (f) => fetch(`fixtures/${f}`).then((r) => r.text());
const kw35 = await res("weekplan_kw35.html");
const kw42 = await res("weekplan_kw42_order.html");

// Ersetzungen nur in den Tags des einen Tages.
const patchDay = (html, iso, ...reps) =>
  html.replace(new RegExp(`<[^>]*menu_quantity_${iso}_[\\s\\S]*?>`, "g"), (tag) => reps.reduce((t, [a, b]) => t.split(a).join(b), tag));
const withoutOrders = (html, iso) =>
  patchDay(html, iso, ['data-order-status="2"', 'data-order-status="0"'], ['data-quantity-ordered="1"', 'data-quantity-ordered=""']);

await test("echtes Fixture: alle Tage bestellt", () => {
  const p = parseWeekplan(kw35);
  eq(p.displayedWeek, 35, "KW");
  eq(p.days.size, 5, "Tage");
  eq([...p.days.values()].every((d) => d.state === OrderState.ORDERED), true, "alle bestellt");
});
await test("vergessen, aber noch bestellbar", () => {
  const d = parseWeekplan(withoutOrders(kw35, "2026-08-27")).days.get("2026-08-27");
  eq(d.state, OrderState.NOT_ORDERED); eq(d.isActionable, true);
});
await test("vergessen nach Bestellschluss", () => {
  eq(parseWeekplan(withoutOrders(kw35, "2026-08-24")).days.get("2026-08-24").state, OrderState.DEADLINE_PASSED);
});
await test("im Warenkorb liegengeblieben", () => {
  const html = patchDay(withoutOrders(kw35, "2026-08-27"), "2026-08-27", ['data-quantity-in-shopping-cart=""', 'data-quantity-in-shopping-cart="1"']);
  eq(parseWeekplan(html).days.get("2026-08-27").state, OrderState.IN_CART);
});
await test("unbekannter Status geht nie durch", () => {
  const html = patchDay(withoutOrders(kw35, "2026-08-27"), "2026-08-27", ['data-order-status="0"', 'data-order-status="7"']);
  eq(parseWeekplan(html).days.get("2026-08-27").state, OrderState.UNKNOWN);
});
await test("leere Ferienwoche ist kein Fehler", () => {
  eq(parseWeekplan('<div id="weekplan"><div>KW 30</div></div>').days.size, 0);
});
// Geändertes Markup: Bestellknöpfe da, aber nichts lesbar → Fehler statt „kein Angebot“.
const parserError = (html, what) => {
  try { parseWeekplan(html); } catch (e) { if (e instanceof ParserError) return; throw new Error(`${what}: ${e.message}`); }
  throw new Error(`${what}: kein ParserError`);
};
await test("Umbenanntes Status-Attribut wirft statt „kein Angebot“", () => {
  parserError(kw35.replaceAll("data-order-status", "data-orderstatus"), "Wochenplan KW 35");
  parserError(kw42.replaceAll("data-order-status", "data-state"), "Wochenplan KW 42");
});
await test("Datum nicht lesbar (ID und data-date geändert) wirft", () => {
  parserError(kw35.replace(/menu_quantity_(\d{4})-(\d{2})-(\d{2})/g, "mq$3$2$1").replaceAll("data-date=", "data-day="), "Wochenplan");
});
await test("Ferienwoche ohne Knöpfe und echte Pläne bleiben ohne Fehler", () => {
  eq(parseWeekplan('<div id="weekplan"><h2>KW 43</h2><p>Für diese Woche ist kein Speiseplan hinterlegt.</p></div>').days.size, 0, "Ferien");
  eq(parseWeekplan('<li class="plan" id="dayplan"><p>Kein Angebot</p></li>').days.size, 0, "Tagesansicht leer");
  eq([parseWeekplan(kw35).days.size, parseWeekplan(kw42).days.size], [5, 4], "Fixtures");
});
await test("Fehlerseite wirft", () => {
  throws(() => parseWeekplan("<html><body><p>Sitzung abgelaufen</p></body></html>"), "Fehlerseite");
  throws(() => parseWeekplan('<div class="login-container">Anmelden</div>'), "Login");
});
await test("KW 42: Bestell-IDs, Kaltverpflegung, Warenkorb, Umlaute", () => {
  const p = parseWeekplan(kw42);
  eq(p.displayedWeek, 42, "KW");
  const mon = p.days.get("2026-10-12");
  const e = mon.entries[0];
  eq([e.customerId, e.menuGroupId, e.menuLineId, e.selectable], ["1000", "16", "827", true], "Linie 827");
  eq(mon.entries.find((x) => x.name === "Kaltverpflegung").selectable, false, "Kaltverpflegung");
  eq(mon.entries[1].name, "Gemüseeintopf", "Umlaut");
  eq(p.days.get("2026-10-13").state, OrderState.IN_CART, "Di Warenkorb");

// Ein Hinweis mit anderer KW vor dem Seitenkopf darf die Gegenprobe nicht stören.
const kw42hint = kw42.replace('<div class="weekplan-title">', '<p class="hint">Bestellschluss für KW 7 beachten!</p><div class="weekplan-title">');
await test("KW: Hinweis mit anderer KW vor dem Kopf, Kopf zählt", () => {
  eq(kw42hint.indexOf("KW 7") < kw42hint.indexOf("weekplan-title"), true, "Hinweis steht vor dem Kopf");
  const p = parseWeekplan(kw42hint);
  eq([p.displayedWeek, p.weeksMentioned.sort()], [42, [42, 7]]);
});
await test("KW: ohne Kopf zählen alle Nennungen", () => {
  const noTitle = kw42hint.replace('class="weekplan-title"', 'class="title"');
  eq([parseWeekplan(noTitle).displayedWeek, parseWeekplan(noTitle).weeksMentioned.sort()], [null, [42, 7]]);
  eq(parseWeekplan(kw42.replace('class="weekplan-title"', 'class="title"')).displayedWeek, 42, "eine Nennung");
});
await test("KW: collect mit Hinweis lädt, falsche Woche wirft weiter", async () => {
  const days = await collect({ async weekplan() { return kw42hint; } }, ["2026-10-12"]);
  eq(days.map((d) => d.date), ["2026-10-12"]);
  let err = null;
  try { await collect({ async weekplan() { return kw42hint; } }, ["2026-10-19"]); } catch (e) { err = e; }
  eq(/Angefragt war KW 43, geliefert wurde KW 42/.test(err?.message || ""), true, `Fehler: ${err?.message}`);
  err = null;
  const noTitle = kw42hint.replace('class="weekplan-title"', 'class="title"');
  try { await collect({ async weekplan() { return noTitle; } }, ["2026-10-19"]); } catch (e) { err = e; }
  eq(/geliefert wurde KW (7\/42|42\/7)$/.test(err?.message || ""), true, `ohne Kopf: ${err?.message}`);
  eq((await collect({ async weekplan() { return noTitle; } }, ["2026-10-12"])).length, 1, "ohne Kopf, Woche genannt");
});

await test("Letzter Weckruf vor dem Bestellschluss: täglich nächster und übernächster Schultag", () => {
  const daily = [1, 2, 3, 4, 5];
  // Mo 26.10.: Di, Mi dringend, Do noch nicht
  eq(["2026-10-27", "2026-10-28", "2026-10-29"].map((d) => lastCall("2026-10-26", d, daily)), [true, true, false]);
  // Fr 30.10.: Mo, Di dringend, Mi nicht
  eq(["2026-11-02", "2026-11-03", "2026-11-04"].map((d) => lastCall("2026-10-30", d, daily)), [true, true, false], "übers Wochenende");
  // Weckruf nur freitags: am Fr ist der Mi danach dringend (nächster Weckruf erst am Fr)
  eq(["2026-11-04", "2026-11-09", "2026-11-10"].map((d) => lastCall("2026-10-30", d, [5])), [true, true, false], "nur freitags");
  // Weckruf Mo und Do: am Mo ist der Fr noch nicht dran, der Do schon
  eq(["2026-10-29", "2026-10-30", "2026-11-02"].map((d) => lastCall("2026-10-26", d, [1, 4])), [true, true, false], "Mo und Do");
});

  eq(nextWeekday("2026-10-05", [1, 3]), "2026-10-07", "Mo → Mi");
});
await test("Längste Lücke zwischen Weckruf-Tagen", () => {
  eq([longestGap([1, 2, 3, 4, 5]), longestGap([1, 4]), longestGap([1]), longestGap([3, 1])], [3, 4, 7, 5]);
});
await test("Datum und Profil", () => {
  eq(De.long("2026-08-27"), "Donnerstag, 27.08.2026");
  eq(new Profile("Muster, Mia").firstName, "Mia");
  eq(/^\d{4}-\d{2}-\d{2}$/.test(todayBerlin()), true, "todayBerlin");

  eq(todayBerlin(new Date("2026-12-31T22:59:00Z")), "2026-12-31", "todayBerlin Silvester MEZ");
  eq(CartResponse.from({ MessageStatus: "OK", TotalItemsInCart: 2 }).totalItemsInCart, 2, "PascalCase");

const dayOpen = await fetch("dayplan_open.html").then((r) => r.text());

const histDesktop = await fetch("orderhistory_desktop.html").then((r) => r.text());

await test("collect mit peek: heute aus der Historie, ohne Treffer aus der Tagesansicht", async () => {
  const asked = [];
  const fake = { dayView: true, async orderHistory() { return histMobile; }, async dayplan(d) { asked.push(d); return '<li class="plan" id="dayplan"></li>'; } };
  const days = await collect(fake, ["2026-10-07"], { history: true, peek: ["2026-10-05", "2026-10-08"] });
  eq(asked, ["2026-10-07", "2026-10-08"], "Tagesansicht nur ohne Historientreffer");
  eq(days.map((d) => [d.date, d.state]), [["2026-10-05", OrderState.ORDERED], ["2026-10-07", OrderState.NO_OFFER],
    ["2026-10-08", OrderState.NO_OFFER]], "Zustände");
  eq(days[0].orderedItems, ["Spiralnudeln"], "Gericht");
  asked.length = 0;
  eq((await collect(fake, [], { history: true, peek: ["2026-10-06"] })).map((d) => d.state), [OrderState.ORDERED], "nur heute");
  eq(asked, [], "ohne Tagesansicht");
});
{
  // Heute (12.10.) steht nicht in der Historie: Feiertag, vor über 90 Tagen bestellt oder vergessen.
  const today = (dayplan, history = histMobile) => {
    const asked = [];
    const fake = { dayView: true, async orderHistory() { return history; }, async dayplan(d) { asked.push(d); return dayplan; } };
    return collect(fake, [], { history: true, peek: ["2026-10-12"] }).then((days) => ({ days, asked }));
  };
  const closed = dayOpen.replaceAll('data-readonly="false"', 'data-readonly="true"').replaceAll('data-order-status="2"', 'data-order-status="0"').replaceAll('data-quantity-ordered="1"', 'data-quantity-ordered=""');
  const { composeToday } = await import("../sw.js");
  const morning = (day) => composeToday([{ customerNo: "1", firstName: "Mia", day, noMeal: "", holiday: "", skip: false }]);
  await test("Heute ohne Historientreffer: Feiertag/kein Angebot → kein Angebot, still", async () => {
    const { days, asked } = await today('<li class="plan" id="dayplan"></li>');
    eq([asked, days.map((d) => d.state)], [["2026-10-12"], [OrderState.NO_OFFER]], "eine Tagesansicht");
    const m = morning(days[0]);
    eq([m.title, m.body, m.quiet], ["Heute kein Schulessen", "kein Angebot", true]);
  });
  await test("Heute ohne Historientreffer, aber bestellt (vor über 90 Tagen) → Gericht", async () => {
    const { days } = await today(dayOpen);
    eq([days[0].state, days[0].orderedItems], [OrderState.ORDERED, ["Dinkel-Makkaroni mit Gemüsesoße"]]);
    eq(morning(days[0]).title, "Heute gibt's für Mia");
  });
  await test("Heute ohne Historientreffer und nicht bestellt → Brot einpacken", async () => {
    const { days } = await today(closed);
    eq(days[0].state, OrderState.DEADLINE_PASSED);
    eq(morning(days[0]).title, "Heute kein Essen bestellt für Mia");
  });
  await test("Heute bei unlesbarer Historie aus der Tagesansicht", async () => {
    const { days, asked } = await today(dayOpen, "<html>Fehler</html>");
    eq([asked, days.map((d) => d.state)], [["2026-10-12"], [OrderState.ORDERED]]);
  });
  await test("Morgens: unklarer Status → nicht „Brot einpacken“, laut", () => {
    const m = morning(new DayStatus("2026-10-12", OrderState.UNKNOWN));
    eq([m.title, m.quiet], ["Essen heute unklar für Mia", false]);
  });
}

// Zwischenspeicher über client.dayStore, mit Tagen in der Zukunft (Vergangenes wird verworfen).
const emptyDay = '<li class="plan" id="dayplan"></li>';
const memStore = (rows = [], customerNo = "1000") => ({ rows, load() { return { customerNo, rows: this.rows }; }, save(v) { customerNo = v.customerNo; this.rows = v.rows; } });
const row = (date, state, ageMin) => ({ date, at: Date.now() - ageMin * 60000, day: { date, state, entries: [] } });
{
  const t = todayBerlin();
  const [d1, d2, d3] = [addDays(t, 3), addDays(t, 4), addDays(t, 5)];
  await test("Zwischenspeicher: offen 10 Minuten, ab nächster Woche 6 Stunden", async () => {
    const [near, far, farther] = [t, addDays(t, 14), addDays(t, 21)];
    const asked = [];
    const store = memStore([
      row(farther, OrderState.DEADLINE_PASSED, 60),
      row(near, OrderState.NOT_ORDERED, 15), // diese Woche, abgelaufen
      row(far, OrderState.NOT_ORDERED, 180), // ab nächster Woche, noch gültig
      row(addDays(t, 15), OrderState.ORDERED, 7 * 60), // ab nächster Woche, abgelaufen
    ]);
    const fake = { customerNo: "1000", dayView: true, dayStore: store, async dayplan(d) { asked.push(d); return emptyDay; } };
    const days = await collect(fake, [near, far, addDays(t, 15), farther]);
    eq(asked.sort(), [near, addDays(t, 15)].sort(), "nur die abgelaufenen Tage");
    eq(days.map((d) => d.state), [OrderState.NO_OFFER, OrderState.NOT_ORDERED, OrderState.NO_OFFER, OrderState.DEADLINE_PASSED]);
    eq(store.rows.find((r) => r.date === near).day.state, OrderState.NO_OFFER, "gespeichert");
  });
  await test("Zwischenspeicher: „Bestellschluss vorbei“ gilt nicht für immer (#4 K10)", async () => {
    const asked = [];
    const store = memStore([
      row(d1, OrderState.DEADLINE_PASSED, 15), // diese oder nächste Woche, länger als 10 Minuten her
      row(addDays(t, 14), OrderState.DEADLINE_PASSED, 7 * 60), // ab nächster Woche, älter als 6 Stunden
      row(addDays(t, 21), OrderState.DEADLINE_PASSED, 5), // frisch
    ]);

  await test("Zwischenspeicher: bestellt, in der Historie abbestellt → neu geladen", async () => {
    const asked = [];

const { login, withSession } = await import("../session.js");
// Token werden nur für gespeicherte Konten abgelegt; die Testkonten danach wieder entfernen.
const SessAcc = await import("../accounts.js");
await test("Sitzung: Token gespeichert, wiederverwendet, bei Ablauf einmal neu", async () => {
  const creds = { customerNo: `test-${Date.now()}`, password: "x" };
  await SessAcc.upsertAccount(creds);
  let logins = 0;
  const mk = () => ({ async login() { logins++; this.token = `T${logins}`; return new Profile("Muster, Max"); } });
  const a = mk();
  eq(await withSession(a, creds, async () => a.token), "T1", "erster Login");
  const b = mk();
  eq(await withSession(b, creds, async () => b.token), "T1", "gespeicherter Token");
  eq([logins, b.profile.firstName], [1, "Max"], "kein zweiter Login, Profil da");
  let calls = 0;
  const r = await withSession(b, creds, async () => { if (++calls === 1) throw new IbsAuthError("abgelaufen"); return b.token; });
  eq([r, calls, logins], ["T2", 2, 2], "neu angemeldet und wiederholt");
  const c = mk();
  eq(await withSession(c, creds, async () => c.token, { persist: false }), "T3", "ohne Speichern kein gespeicherter Token");
  await SessAcc.removeAccount(creds.customerNo);
});

// Mehrere Kinder: Konten, Übernahme, Zwischenspeicher.
{
  const Acc = await import("../accounts.js");
  const { kvGet, kvSet, secretGet, secretSet, kvDel } = await import("../idb.js");
  const backup = { accounts: await secretGet("accounts"), creds: await secretGet("creds"), events: await kvGet("events") };
  await test("Konten: alter Eintrag creds wird übernommen und gelöscht", async () => {
    await kvDel("accounts");
    await secretSet("creds", { customerNo: "1111", password: "p" });
    eq((await Acc.loadAccounts()).map((a) => a.customerNo), ["1111"]);
    eq(await kvGet("creds"), undefined, "creds weg");
    eq((await Acc.loadAccounts()).length, 1, "zweites Lesen gleich");
  });
  await test("Konten: hinzufügen, ersetzen, entfernen samt Speicher und Terminen", async () => {
    await Acc.upsertAccount({ customerNo: "2222", password: "q", name: "Muster, Ben" });
    await Acc.upsertAccount({ customerNo: "1111", password: "neu" });
    eq((await Acc.loadAccounts()).map((a) => [a.customerNo, a.password]), [["1111", "neu"], ["2222", "q"]]);
    eq(Acc.accountLabel((await Acc.loadAccounts())[1]), "Ben");
    eq(Acc.accountLabel({ customerNo: "1111" }), "Kd. 1111");
    await kvSet("dayCache:2222", { customerNo: "2222", rows: [] });
    await kvSet("events", [{ id: "a", who: "2222" }, { id: "b", who: null }, { id: "c", who: "1111" }]);
    await Acc.removeAccount("2222");
    eq((await Acc.loadAccounts()).map((a) => a.customerNo), ["1111"]);
    eq(await kvGet("dayCache:2222"), undefined, "Speicher weg");
    eq((await kvGet("events")).map((e) => e.id), ["b", "c"], "nur seine Termine weg");
  });
  await test("Tages-Speicher je Kundennummer, alter Eintrag als Rückfall", async () => {
    const c = { customerNo: "1111" };
    const st = Acc.dayStore(c);
    await kvSet("dayCache", { customerNo: "1111", rows: ["alt"] });
    eq((await st.load()).rows, ["alt"], "Rückfall");
    await st.save({ customerNo: "1111", rows: ["neu"] });
    c.customerNo = "3333";
    eq((await st.load()).rows, ["alt"], "anderes Konto: nicht der von 1111");
    c.customerNo = "1111";
    eq((await st.load()).rows, ["neu"]);
    await kvDel("dayCache:1111");
    await kvDel("dayCache");
  });
  await test("Tages-Speicher: nichts ablegen für ein entferntes Konto (#4 L)", async () => {
    await Acc.dayStore({ customerNo: "9999" }).save({ customerNo: "9999", rows: ["x"] });
    eq(await kvGet("dayCache:9999"), undefined, "nicht abgelegt");
  });
  // Echte Daten der Testseite wiederherstellen.
  await kvDel("accounts");
  await test("Konten: Namen merken holt kein entferntes Kind zurück und lässt das neue Passwort", async () => {
    await kvDel("accounts");
    await Acc.upsertAccount({ customerNo: "3333", password: "alt", name: "" });
    await Acc.upsertAccount({ customerNo: "3333", password: "neu" }); // Seite: neues Passwort
    await Acc.renameAccount("3333", "Muster, Ida"); // Service Worker: Name aus IBS5
    eq((await Acc.loadAccounts()).map((a) => [a.password, a.name]), [["neu", "Muster, Ida"]]);
    await Acc.removeAccount("3333");
    await Acc.renameAccount("3333", "Muster, Ida");
    eq((await Acc.loadAccounts()).length, 0, "entferntes Konto bleibt entfernt");
  });
  await test("Schlüssel: gleichzeitig zum ersten Mal angelegt, beide Einträge lesbar", async () => {
    await kvDel("accounts");
    await kvDel("cryptoKey");
    await Promise.all([secretSet("t.k1", { a: 1 }), secretSet("t.k2", { b: 2 })]);
    eq([await secretGet("t.k1"), await secretGet("t.k2")], [{ a: 1 }, { b: 2 }]);
    await kvDel("t.k1");
    await kvDel("t.k2");
  });
  await test("IndexedDB: verlorene Verbindung wird neu geöffnet (#4 K9)", async () => {
    const { closeConnection, kvRead, kvUpdate } = await import("../idb.js");
    await kvSet("t.k9", 1);
    await closeConnection();
    eq(await kvRead("t.k9"), 1, "strenges Lesen");
    await closeConnection();
    await kvSet("t.k9", 2);
    eq(await kvGet("t.k9"), 2, "Schreiben");
    await closeConnection();
    eq(await kvUpdate("t.k9", (v) => ({ value: v + 1, result: v })), 2, "kvUpdate");
    await closeConnection();
    await Acc.upsertAccount({ customerNo: "4444", password: "p" });
    await closeConnection();
    eq((await Acc.loadAccounts()).some((a) => a.customerNo === "4444"), true, "Konten nach Verbindungsverlust");
    await Acc.removeAccount("4444");
    await kvDel("t.k9");
  });
  await test("IndexedDB: Lesefehler der Konten wird geworfen statt „keine Konten“ (#4 K9)", async () => {
    const realTx = IDBDatabase.prototype.transaction;
    const { closeConnection } = await import("../idb.js");
    await closeConnection();
    // Jede Transaktion scheitert wie bei iOS, auch nach dem Neuöffnen.
    IDBDatabase.prototype.transaction = function () { throw new DOMException("Connection to Indexed Database server lost", "UnknownError"); };
    let err = null;
    try { await Acc.loadAccounts(); } catch (e) { err = e; } finally { IDBDatabase.prototype.transaction = realTx; }
    eq(err?.name, "UnknownError", `Fehler: ${err}`);
  });
  await test("IndexedDB: verlorene Verbindung schon beim Neuöffnen ist kein „keine IndexedDB“ (#4 K9)", async () => {
    const { closeConnection } = await import("../idb.js");
    const [realTx, realOpen] = [IDBDatabase.prototype.transaction, IDBFactory.prototype.open];
    await closeConnection();
    let tx = 0;
    IDBDatabase.prototype.transaction = function (...a) { if (!tx++) throw new DOMException("lost", "UnknownError"); return realTx.apply(this, a); };
    IDBFactory.prototype.open = function () {
      const req = {};
      setTimeout(() => { req.error = new DOMException("Connection to Indexed Database server lost", "UnknownError"); req.onerror?.(); }, 0);
      return req;
    };
    let err = null;
    try { await Acc.loadAccounts(); } catch (e) { err = e; } finally { Object.assign(IDBDatabase.prototype, { transaction: realTx }); IDBFactory.prototype.open = realOpen; }
    eq(err?.name, "UnknownError", `Fehler: ${err}`);
    eq((await Acc.loadAccounts()).length >= 0, true, "danach wieder lesbar");
  });
  if (backup.accounts) await secretSet("accounts", backup.accounts);
  if (backup.creds) await secretSet("creds", backup.creds);
  await kvSet("events", backup.events || []);
}

// Eigene Termine und die Meldung des Weckrufs.
{
  const Ev = await import("../events.js");
  const { compose } = await import("../sw.js");
  const { kvSet } = await import("../idb.js");
  const t = todayBerlin();
  const ev = (id, date, lead, noMeal = false, title = id) => ({ id, title, date, lead, noMeal });
  const day = (date, state) => new DayStatus(date, state, state === OrderState.ORDERED ? [{ isOrdered: true, name: "Nudeln" }] : []);

  await test("Termine: fällig ab Vorlauf bis zum Tag, vergangene fallen weg", async () => {
    const list = [ev("a", addDays(t, 3), 2), ev("b", addDays(t, 3), 3), ev("c", t, 1), ev("d", addDays(t, -1), 7)];
    eq(Ev.dueEvents(list, t).map((e) => e.id), ["b", "c"]);
    await kvSet("events", list);
    eq((await Ev.loadEvents(t)).map((e) => e.id), ["c", "a", "b"], "vergangener gelöscht, nach Datum");
    await kvSet("events", []);
  });
  await test("Termine: Zeilen je nach Bestellstand", () => {
    const d = addDays(t, 2);
    eq(Ev.eventLine(ev("x", t, 1, false, "Sportfest"), null, t), "Heute: Sportfest");
    eq(Ev.eventLine(ev("x", d, 2, true, "Ausflug"), day(d, OrderState.ORDERED), t).endsWith("Essen ist bestellt, bitte abbestellen"), true, "bestellt");
    eq(Ev.eventLine(ev("x", d, 2, true, "Ausflug"), day(d, OrderState.NOT_ORDERED), t).endsWith("nichts bestellt ✓"), true, "nicht bestellt");
  });
  await test("Weckruf: alles bestellt ohne Termin bleibt still", () => {
    const days = [day(addDays(t, 1), OrderState.ORDERED)];
    const m = compose({ checked: days, due: [], days, today: t });
    eq([m.title, m.quiet], ["Alles erledigt ✓", true]);
  });
  await test("Weckruf: Termin in derselben Meldung, laut, ohne Bestellwarnung", () => {
    const d = addDays(t, 1);
    const days = [day(d, OrderState.ORDERED)];
    const m = compose({ checked: days, due: [ev("w", d, 2, false, "Wandertag")], days, today: t });
    eq([m.title, m.quiet, m.url], ["Termin: Wandertag", false, "./"]);
    eq(m.body.includes("Morgen: Wandertag") && m.body.includes("alles bestellt"), true, m.body);
  });
  await test("Weckruf: Tag ohne Schulessen bestellt → abbestellen, Tippen öffnet den Tag", () => {
    const d = addDays(t, 2);
    const days = [day(d, OrderState.ORDERED)];
    const m = compose({ checked: [], due: [ev("a", d, 2, true, "Ausflug")], days, today: t });
    eq([m.title, m.url], ["Essen abbestellen: Ausflug", `./?order=${d}`]);
    eq(m.keys, [`${d}:ev:a:cancel`]);
  });
  await test("Weckruf: offener Tag und Termin zusammen", () => {
    const [d1, d2] = [addDays(t, 1), addDays(t, 2)];
    const days = [day(d1, OrderState.NOT_ORDERED), day(d2, OrderState.ORDERED)];
    const m = compose({ checked: days, due: [ev("s", d2, 1, false, "Sportfest")], days, today: t, firstName: "Mia" });
    eq(m.title, "1 ausstehende Bestellung für Mia");
    eq(m.body.includes("Bestellen ist noch möglich") && m.body.includes("Sportfest"), true, m.body);
    eq(m.url, `./?order=${d1}`);
  });
}

// Netzfehler bei IBS5: ein zweiter Versuch, erst dann Pause (guard.js).
{
  const { IbsClient, pacing } = await import("../ibs.js");
  const { guardHooks, paused, resume } = await import("../guard.js");
  const { kvDel, kvGet } = await import("../idb.js");
  const realFetch = window.fetch;
  const old = { ...pacing };
  const reset = async () => { await resume(); await kvDel("ibsSilentAt"); };
  const login = async (replies) => {
    await reset();
    let calls = 0;
    window.fetch = async () => { const r = replies[calls++]; if (r instanceof Error) throw r; return r; };
    Object.assign(pacing, { gapMs: 0, jitterMs: 0, retryMs: 50 });
    const t0 = performance.now();
    let err = null;
    try { await new IbsClient(undefined, guardHooks).login("1", "x"); } catch (e) { err = e; } finally { window.fetch = realFetch; Object.assign(pacing, old); }
    const p = await paused();
    return { calls, err, ms: performance.now() - t0, pauseMin: p ? Math.round((p.until - Date.now()) / 60000) : 0, budget: ((await kvGet("ibsBudget")) || []).length };
  };
  const net = () => new TypeError("Failed to fetch");
  await test("Netzfehler beim Login: zweiter Versuch nach Wartezeit klappt, keine Pause, beide gezählt", async () => {
    const r = await login([net(), new Response(JSON.stringify({ token: "t", name1: "" }))]);
    eq([r.err?.message ?? null, r.calls, r.pauseMin, r.budget, r.ms >= 45], [null, 2, 0, 2, true], `${Math.round(r.ms)} ms`);
  });
  await test("Netzfehler auch beim zweiten Versuch: Pause wie bisher (15 Minuten)", async () => {
    const r = await login([net(), net()]);
    eq([r.calls, r.err?.network, r.pauseMin, r.budget], [2, true, 15, 2]);
  });
  await test("Zeitüberschreitung: kein zweiter Versuch", async () => {
    const r = await login([new DOMException("timeout", "TimeoutError")]);
    eq([r.calls, /antwortet nicht/.test(r.err?.message || "")], [1, true]);
  });
  await reset();
}

// Gescheiterter Weckruf: Klartext, ein einzelner Aussetzer still, der zweite laut.
{
  const { composeToday, composeFailure, composeAll, markFailures, ringsLoud } = await import("../sw.js");
  const { pushFailure } = await import("../errors.js");
  const { IbsError } = await import("../ibs.js");
  const { IbsPausedError } = await import("../guard.js");
  const { kvDel } = await import("../idb.js");
  const netErr = () => Object.assign(new IbsError("Keine Verbindung zum Bestellsystem (/Login/Login): Failed to fetch"), { network: true });
  const kid = (error, no = "1", firstName = "Mia") => ({ customerNo: no, firstName, due: [], noMeal: "", holiday: "", skip: false, error, notice: error && pushFailure(error) });
  const plain = (m) => !/\/Login|Failed to fetch|keine Antwort beim/.test(`${m.title}\n${m.body}`);
  await kvDel("pushFailed");
  await test("Morgens: Netzfehler beim ersten Mal still, beim nächsten Weckruf laut, im Klartext", async () => {
    const a = kid(netErr());
    await markFailures([a]);
    const m1 = composeToday([a]);
    eq([m1.title, m1.quiet, plain(m1)], ["Bestellsystem gerade nicht erreichbar", true, true], m1.body);
    eq(m1.body, "Ob bestellt ist, prüft die App beim nächsten Mal. Zum sofortigen Versuch die App öffnen.");
    const b = kid(netErr());
    await markFailures([b]);
    eq(composeToday([b]).quiet, false, "zweites Mal");
    // Ein geglückter Weckruf dazwischen setzt das zurück.
    await markFailures([{ customerNo: "1" }]);
    const c = kid(netErr());
    await markFailures([c]);
    eq(composeToday([c]).quiet, true, "nach Erfolg");
  });
  await test("Erinnerung: Netzfehler erst beim zweiten Mal laut, je Kind", async () => {

    const all2 = composeAll([ok, ben], todayBerlin());

    await kvDel("pushFailed");
    const until = Date.now() + 15 * 60000;
    const a = kid(new IbsPausedError(until, "keine Antwort beim Anmelden"));

// Bestellen gegen einen Schein-Client.
class FakeClient {
  constructor({ extraInCart = 0, failSubmit = false } = {}) {
    Object.assign(this, { extraInCart, failSubmit, items: [], calls: [], submitted: false });
  }
  total() { return this.items.length + this.extraInCart; }
  async cart() { this.calls.push("cart"); return new CartResponse(true, null, this.total()); }
  async clearCart(c, date, g) { this.calls.push(`clear ${date}`); this.items = this.items.filter((x) => x.date !== date); return new CartResponse(true, null, this.total()); }
  async addToCart(e) {
    this.calls.push(`add ${e.date} ${e.menuLineId}`);
    this.items.push(e);
    if (this.switchFrom?.[e.date]) this.items.push({ date: e.date, cancel: true });
    return new CartResponse(true, null, this.total());
  }
  async cancelInCart(e) { this.calls.push(`cancel ${e.date}`); this.items.push(e); return new CartResponse(true, null, this.total()); }
  async submitCart() { this.calls.push("submit"); this.submitted = !this.failSubmit; return new CartResponse(!this.failSubmit, this.failSubmit ? "nein" : null, 0); }
  async discardCart() { this.calls.push("discard"); this.items = []; this.extraInCart = 0; }
  async cartPage() { this.calls.push("cartPage"); return cartHtml(this.page || []); }
}
/** Warenkorbseite (Desktop) mit den Einträgen {date, name, kind}; date null = unlesbar. */
const cartHtml = (items) => `<div id="shopping-cart"><table><tbody>${items.map((i) => `<tr>
  <td><span>${i.date ? `Mo ${i.date.slice(8, 10)}.${i.date.slice(5, 7)}.${i.date.slice(0, 4)}` : "—"}</span></td>
  <td><div>${i.name}</div></td><td><div>${i.kind}</div></td><td>1</td><td>1</td></tr>`).join("")}</tbody></table></div>`;
const p42 = parseWeekplan(kw42);
const line = (date, id) => p42.days.get(date).entries.find((e) => e.menuLineId === id);
/** Tag aus KW 42 mit genau den Linien aus ordered (id → Menge) bestellt; closed: Bestellschluss vorbei. */
const freshDay = (date, ordered = {}, closed = false) => new DayStatus(date, Object.keys(ordered).length ? OrderState.ORDERED : OrderState.NOT_ORDERED, p42.days.get(date).entries.map((e) => new MenuEntry({
  ...e, status: ordered[e.menuLineId] ? "2" : "0", quantityOrdered: ordered[e.menuLineId] ? String(ordered[e.menuLineId]) : "",
  quantityInCart: "", orderable: !closed && e.orderable,
})));
/** reload, der beim ersten Aufruf (vor dem Warenkorb) before und danach after liefert; je {Datum: {Linie: Menge}}. */
const states = (before, after) => {
  let calls = 0;
  return async (ds) => {
    const s = calls++ === 0 ? before : after;
    return ds.map((d) => freshDay(d, s[d]));
  };
};
const orderedAfter = (date, id, was = null) => states(was ? { [date]: { [was]: 1 } } : {}, { [date]: { [id]: 1 } });
