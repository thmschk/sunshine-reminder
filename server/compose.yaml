# Push-Wecker der Web-App; erreichbar nur über Caddy auf demselben Server.
services:
  push:
    build: ./push
    restart: unless-stopped
    environment:
      VAPID_SUBJECT: "https://sunshine.thomschke.info"
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    # Nur lokal erreichbar; Caddy läuft im Netz des Servers und reicht /api/ hierher.
    ports:
      - "127.0.0.1:18080:8080"
